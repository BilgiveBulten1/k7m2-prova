@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

.gate * { box-sizing: border-box; }
.gate {
  --ink:#0E1726; --ink2:#18243A; --paper:#E9EAE4; --card:#FFFFFF;
  --rule:#C8CCC3; --muted:#5C6472; --amber:#F5C518; --red:#C8324B; --green:#2E8B62;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper); color:var(--ink);
  min-height:100vh; width:100%;
}
.gate .wrap { max-width:760px; margin:0 auto; padding:20px 16px 40px; }
.gate .cap {
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase;
  letter-spacing:.14em; font-weight:600;
}
.gate .mono { font-family:'IBM Plex Mono',monospace; }

/* --- top bar --- */
.gate .bar { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; }
.gate .logo { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; letter-spacing:.2em; text-transform:uppercase; line-height:1; }
.gate .logo span { color:var(--red); }
.gate .tag { font-size:12px; color:var(--muted); letter-spacing:.06em; }
.gate .counter { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); text-align:right; line-height:1.5; white-space:nowrap; }
.gate .counter b { color:var(--ink); font-weight:600; }

/* --- departure board --- */
.gate .board {
  background:var(--ink); border-radius:3px; padding:14px 16px; position:relative; overflow:hidden;
}
.gate .board::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.045) .6px, transparent .7px);
  background-size:3px 3px;
}
.gate .board-line { font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:13px; letter-spacing:.03em; line-height:1.55; }
.gate .board-sub { font-family:'IBM Plex Mono',monospace; color:#7E8CA3; font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px; }
.gate .blink { display:inline-block; width:7px; height:14px; background:var(--amber); vertical-align:-2px; margin-left:3px; animation:bl 1.1s steps(2) infinite; }
@keyframes bl { 0%,50%{opacity:1} 51%,100%{opacity:0} }

/* --- section head --- */
.gate .head { display:flex; align-items:center; gap:10px; margin:26px 0 12px; }
.gate .head h2 { font-family:'Barlow Condensed',sans-serif; font-size:15px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; margin:0; }
.gate .head .rule { flex:1; height:1px; background:var(--rule); }

/* --- scenario tiles --- */
.gate .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
@media (max-width:560px){ .gate .grid { grid-template-columns:1fr; } }
.gate .tile {
  background:var(--card); border:1px solid var(--rule); border-radius:3px; padding:12px 14px;
  text-align:left; cursor:pointer; display:block; width:100%;
  transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.gate .tile:hover { transform:translateY(-2px); border-color:var(--ink); box-shadow:0 6px 0 -3px rgba(14,23,38,.18); }
.gate .tile:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
.gate .code {
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; letter-spacing:.18em;
  background:var(--ink); color:var(--amber); padding:2px 6px; border-radius:2px;
}
.gate .tile-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.gate .place { font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-family:'Barlow Condensed',sans-serif; font-weight:600; }
.gate .tile h3 { margin:0 0 4px; font-size:15px; font-weight:600; line-height:1.3; }
.gate .tile p { margin:0; font-size:12.5px; color:var(--muted); line-height:1.45; }
.gate .dots { display:inline-flex; gap:3px; margin-left:6px; vertical-align:1px; }
.gate .dot { width:5px; height:5px; border-radius:50%; background:var(--rule); }
.gate .dot.on { background:var(--red); }

/* --- buttons --- */
.gate .btn {
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.12em; font-weight:600;
  font-size:14px; padding:11px 18px; border-radius:3px; cursor:pointer; border:1px solid var(--ink);
  background:var(--ink); color:var(--paper); transition:opacity .12s ease;
}
.gate .btn:hover { opacity:.85; }
.gate .btn:disabled { opacity:.4; cursor:not-allowed; }
.gate .btn.ghost { background:transparent; color:var(--ink); }
.gate .btn.amber { background:var(--amber); border-color:var(--amber); color:var(--ink); }
.gate .btn.sm { font-size:12px; padding:7px 12px; letter-spacing:.1em; }
.gate button:focus-visible { outline:2px solid var(--red); outline-offset:2px; }

/* --- segmented --- */
.gate .seg { display:inline-flex; border:1px solid var(--rule); border-radius:3px; overflow:hidden; background:var(--card); }
.gate .seg button {
  border:0; background:transparent; padding:7px 13px; cursor:pointer;
  font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); border-right:1px solid var(--rule);
}
.gate .seg button:last-child { border-right:0; }
.gate .seg button.on { background:var(--ink); color:var(--amber); }

/* --- input --- */
.gate .field {
  width:100%; border:1px solid var(--rule); border-radius:3px; background:var(--card);
  padding:12px 14px; font-family:'Inter',sans-serif; font-size:15px; color:var(--ink); resize:none;
}
.gate .field:focus { outline:none; border-color:var(--ink); }
.gate .field::placeholder { color:#9AA1AC; }

/* --- chat --- */
.gate .turn { margin:16px 0; display:flex; flex-direction:column; }
.gate .role { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
.gate .bubble { max-width:88%; padding:12px 14px; border-radius:3px; font-size:15px; line-height:1.5; }
.gate .npc { background:var(--card); border:1px solid var(--rule); align-self:flex-start; }
.gate .me { background:var(--ink); color:var(--paper); align-self:flex-end; }
.gate .turn.mine { align-items:flex-end; }
.gate .tr { font-size:12.5px; color:var(--muted); margin-top:7px; font-style:italic; }
.gate .link { background:none; border:0; padding:0; cursor:pointer; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-family:'Barlow Condensed',sans-serif; color:var(--muted); text-decoration:underline; text-underline-offset:3px; }

/* --- correction stub --- */
.gate .stub {
  align-self:flex-end; max-width:88%; margin-top:8px; background:var(--card);
  border:1px solid var(--rule); border-left:3px dashed var(--red); border-radius:0 3px 3px 0; padding:10px 13px;
}
.gate .stub.ok { border-left-color:var(--green); }
.gate .stub-h { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--red); margin-bottom:7px; }
.gate .stub.ok .stub-h { color:var(--green); }
.gate .said { font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted); text-decoration:line-through; text-decoration-color:rgba(200,50,75,.5); }
.gate .better { font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink); font-weight:500; margin-top:4px; }
.gate .note { font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.45; }

/* --- misc --- */
.gate .hintbox { background:#FFF8DC; border:1px solid var(--amber); border-radius:3px; padding:11px 13px; font-size:13.5px; line-height:1.5; margin-top:10px; }
.gate .composer { position:sticky; bottom:0; background:var(--paper); padding-top:12px; border-top:1px solid var(--rule); margin-top:20px; }
.gate .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.gate .spacer { flex:1; }
.gate .load { display:inline-flex; gap:4px; align-items:center; }
.gate .load i { width:6px; height:6px; background:var(--muted); border-radius:50%; animation:pp 1s infinite ease-in-out; }
.gate .load i:nth-child(2){ animation-delay:.15s } .gate .load i:nth-child(3){ animation-delay:.3s }
@keyframes pp { 0%,80%,100%{ opacity:.25; transform:translateY(0) } 40%{ opacity:1; transform:translateY(-3px) } }
.gate .err { background:#FDECEF; border:1px solid var(--red); color:var(--red); padding:10px 13px; border-radius:3px; font-size:13px; margin-top:12px; }
.gate .receipt { background:var(--card); border:1px solid var(--rule); border-radius:3px; padding:20px; }
.gate .receipt hr { border:0; border-top:1px dashed var(--rule); margin:16px 0; }
.gate .score { font-family:'Barlow Condensed',sans-serif; font-size:62px; font-weight:700; line-height:.9; }
.gate ul.plain { margin:0; padding-left:18px; }
.gate ul.plain li { font-size:14px; line-height:1.6; margin-bottom:4px; }
/* --- voice --- */
.gate .mic {
  width:64px; height:64px; border-radius:50%; border:1px solid var(--ink); background:var(--ink);
  color:var(--amber); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:transform .12s ease;
}
.gate .mic:hover { transform:scale(1.04); }
.gate .mic:disabled { opacity:.35; cursor:not-allowed; transform:none; }
.gate .mic.live { background:var(--red); border-color:var(--red); color:#fff; animation:ring 1.4s ease-out infinite; }
@keyframes ring { 0%{ box-shadow:0 0 0 0 rgba(200,50,75,.45) } 100%{ box-shadow:0 0 0 16px rgba(200,50,75,0) } }
.gate .mic svg { width:26px; height:26px; }
.gate .ptt { font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.14em; font-size:12px; color:var(--muted); }
.gate .ptt b { color:var(--red); font-weight:600; }
.gate .bars { display:inline-flex; align-items:flex-end; gap:2px; height:14px; vertical-align:-2px; }
.gate .bars i { width:3px; background:var(--amber); border-radius:1px; animation:eq .9s ease-in-out infinite; }
.gate .bars i:nth-child(1){ height:6px } .gate .bars i:nth-child(2){ height:12px; animation-delay:.12s }
.gate .bars i:nth-child(3){ height:8px; animation-delay:.24s } .gate .bars i:nth-child(4){ height:14px; animation-delay:.36s }
@keyframes eq { 0%,100%{ transform:scaleY(.35) } 50%{ transform:scaleY(1) } }
.gate .bars.dark i { background:var(--red); }
.gate .npc.speaking { border-color:var(--ink); box-shadow:0 0 0 2px rgba(245,197,24,.35); }
.gate .toggle {
  display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:12.5px; color:var(--muted);
  background:var(--card); border:1px solid var(--rule); border-radius:3px; padding:7px 11px;
}
.gate .toggle.on { border-color:var(--ink); color:var(--ink); }
.gate .pip { width:9px; height:9px; border-radius:50%; background:var(--rule); flex-shrink:0; }
.gate .toggle.on .pip { background:var(--green); }
.gate .warn { background:#FFF8DC; border:1px solid var(--amber); border-radius:3px; padding:10px 13px; font-size:12.5px; line-height:1.5; margin-top:10px; }
.gate .interim { color:var(--muted); font-style:italic; }
@media (prefers-reduced-motion:reduce){ .gate *, .gate *::after { animation:none !important; transition:none !important; } }
